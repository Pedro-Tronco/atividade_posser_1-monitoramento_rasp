services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: python-backend
    restart: unless-stopped
    network_mode: host
    pid: host
    privileged: true
    volumes:
      - /:/hostfs:ro
      - /sys:/sys:ro
    environment:
      - PORT=8000

  frontend:
    image: caddy:alpine
    container_name: caddy-frontend
    restart: unless-stopped
    ports:
      - "8888:8888"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - .:/usr/share/caddy